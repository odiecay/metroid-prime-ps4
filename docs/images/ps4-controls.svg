  <path d="M926 348H859L811 326" class="wire"/>
  <text x="1162" y="428" text-anchor="end" class="label">Right stick — Aim</text>
  <path d="M959 422H784L737 382" class="wire"/>

  <text x="600" y="143" text-anchor="middle" class="label">Hold touchpad — Port settings</text>
  <text x="600" y="166" text-anchor="middle" class="sub">Click and hold for about 0.8 seconds</text>
  <path d="M600 177V204" class="wire"/>
  <text x="607" y="448" text-anchor="middle" class="label">Options — Pause</text>
  <path d="M698 433H730V274L742 262" class="wire"/>
  <path d="M32 494H1168" stroke="#385763"/>
  <text x="38" y="532" class="sub">Prefer trigger shooting? Choose Modern under Controls → Remap → Presets.</text>
  <text x="38" y="561" class="sub">Bindings can be changed in port settings. Weapons and abilities require the relevant upgrades.</text>
</svg>
