<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Project Prime — DualShock 4 quick guide</title>
  <desc id="description">Original-style buttons with twin-stick aim: left stick moves, right stick aims, Cross fires, Circle jumps, Square morphs, Triangle fires missiles, L2 locks on, R1 opens the map. Options pauses. Hold touchpad click for 0.8 seconds for port settings. Hold L1 with the D-pad to select beams.</desc>
  <metadata>Original illustration for Project Prime. CC0-1.0.</metadata>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#091620"/>
      <stop offset="1" stop-color="#122c39"/>
    </linearGradient>
    <linearGradient id="body" x2="0" y2="1">
      <stop stop-color="#344653"/>
      <stop offset="1" stop-color="#1c2933"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { fill: #f1f5f7; font-size: 21px; font-weight: 600; }
      .sub { fill: #bdced8; font-size: 16px; }
      .wire { fill: none; stroke: #79c7d7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .button { fill: #111d27; stroke: #718491; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="600" rx="16" fill="url(#background)"/>
  <path d="M32 100H1168" stroke="#385763"/>
  <text x="38" y="47" fill="#8ad7e4" font-size="13" font-weight="700" letter-spacing="2.8">PROJECT PRIME / PS4</text>
  <text x="38" y="80" fill="#f4f7f8" font-size="27" font-weight="700">DualShock 4 quick guide</text>
  <text x="1162" y="78" text-anchor="end" class="sub">Original-style buttons · twin-stick aim</text>

  <!-- Original schematic illustration, not a traced manufacturer image. -->
  <path d="M451 214Q433 179 392 195L367 225L325 402Q314 452 347 462Q372 471 402 435L455 375H745L798 435Q828 471 853 462Q886 452 875 402L833 225L808 195Q767 179 749 214Z" fill="url(#body)" stroke="#718491" stroke-width="3"/>
  <rect x="477" y="207" width="246" height="109" rx="15" fill="#16252e" stroke="#718491" stroke-width="2"/>
  <path d="M488 219H712M488 231H712M488 243H712M488 255H712M488 267H712M488 279H712M488 291H712M488 303H712" stroke="#253a47" stroke-width="2"/>
  <rect x="446" y="232" width="14" height="35" rx="7" class="button"/>
  <rect x="741" y="232" width="14" height="35" rx="7" class="button"/>
  <rect x="383" y="185" width="62" height="22" rx="10" class="button"/>
  <rect x="756" y="185" width="62" height="22" rx="10" class="button"/>
  <path d="M392 278H410V260H430V278H448V298H430V316H410V298H392Z" fill="#111d27" stroke="#718491" stroke-width="2"/>
  <circle cx="497" cy="351" r="43" fill="#111d27" stroke="#718491" stroke-width="3"/>
  <circle cx="497" cy="351" r="31" fill="#273842"/>
  <circle cx="703" cy="351" r="43" fill="#111d27" stroke="#718491" stroke-width="3"/>
  <circle cx="703" cy="351" r="31" fill="#273842"/>
  <circle cx="600" cy="354" r="14" class="button"/>
  <circle cx="793" cy="258" r="17" class="button"/>
  <path d="M785 264L793 250L801 264Z" fill="none" stroke="#75d7b2" stroke-width="2"/>
  <circle cx="824" cy="289" r="17" class="button"/>
  <circle cx="824" cy="289" r="8" fill="none" stroke="#ee8b91" stroke-width="2"/>
  <circle cx="793" cy="320" r="17" class="button"/>
  <path d="M787 314L799 326M799 314L787 326" stroke="#80bbee" stroke-width="2"/>
  <circle cx="762" cy="289" r="17" class="button"/>
  <rect x="755" y="282" width="14" height="14" fill="none" stroke="#dea6d6" stroke-width="2"/>

  <text x="38" y="152" class="label">L2 — Lock on / scan</text>
  <path d="M303 146H353L409 185" class="wire"/>
  <text x="38" y="229" class="label">D-pad — Visors</text>
  <text x="38" y="254" class="sub">Hold L1 + D-pad for beams</text>
  <path d="M300 228H348L394 279" class="wire"/>
  <text x="38" y="364" class="label">Left stick — Move</text>
  <path d="M281 357H447" class="wire"/>

  <text x="1162" y="152" text-anchor="end" class="label">R1 — Map</text>
  <path d="M1000 146H849L791 185" class="wire"/>
  <text x="1162" y="222" text-anchor="end" class="label">Triangle — Missile</text>
  <path d="M950 217H869L811 250" class="wire"/>
  <text x="1162" y="266" text-anchor="end" class="label">Circle — Jump</text>
  <path d="M988 260H872L842 282" class="wire"/>
  <text x="1162" y="310" text-anchor="end" class="label">Square — Morph Ball</text>
  <path d="M925 304H862L780 291" class="wire"/>
